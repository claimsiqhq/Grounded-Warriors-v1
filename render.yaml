services:
  - type: web
    name: grounded-warriors
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: corepack enable && corepack prepare pnpm@10.26.1 --activate && pnpm install --frozen-lockfile && pnpm run check && pnpm run build
    preDeployCommand: pnpm run db:migrate
    startCommand: pnpm run start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: grounded-warriors-db
          property: connectionString
      - key: STAFF_EMAILS
        sync: false
      - key: COACHING_INBOX_EMAILS
        sync: false
      - key: APP_URL
        value: https://www.groundedwarriors.com
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_CLERK_PROXY_URL
        value: /api/__clerk
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: FLODESK_API_KEY
        sync: false
      - key: FLODESK_SEGMENT_IDS
        sync: false
      - key: FLODESK_USER_AGENT
        sync: false

databases:
  - name: grounded-warriors-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "18"
