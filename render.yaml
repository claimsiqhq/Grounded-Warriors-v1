services:
  - type: web
    name: grounded-warriors
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install --include=dev && npm run check && npm run build && npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: grounded-warriors-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: STAFF_EMAILS
        sync: false
      - key: COACHING_INBOX_EMAILS
        sync: false
      - key: APP_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: FLODESK_API_KEY
        sync: false
      - key: FLODESK_SEGMENT_IDS
        sync: false
      - key: FLODESK_USER_AGENT
        sync: false

databases:
  - name: grounded-warriors-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
